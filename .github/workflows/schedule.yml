name: Automated News Bot

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write   # Allows the bot to save your generated index.html webpage!

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required libraries
        run: pip install -r requirements.txt

      - name: Run News Paraphraser & Website Builder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_bot.py

      - name: Publish Updated Website to Repository
        run: |
          git config user.name "Auto Hindi News Bot"
          git config user.email "actions@github.com"
          git add index.html articles_db.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Hindi news portal" && git pull --rebase && git push)
