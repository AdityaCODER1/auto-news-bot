        :root {

        body {

            margin-left: 18px;

            font-size: 15px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .nav-pills span:hover { color: var(--accent); }
        .container { max-width: 1200px; margin: 32px auto; padding: 0 20px; }

        /* Astra + Spectra Hero Bento Grid */
        .bento-grid {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 28px;
            margin-bottom: 40px;
        }
        @media (max-width: 860px) { .bento-grid { grid-template-columns: 1fr; } }
        .card {
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.25s ease, transform 0.25s ease;
        }
        .card:hover { box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.08); }
        .img-wrap { overflow: hidden; position: relative; background: #e2e8f0; }
        .img-wrap img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }
        .card:hover .img-wrap img { transform: scale(1.04); }
        .card-body { padding: 24px; }
        .badge {
            display: inline-block;
            background: #FFE4E6;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .hero-title {
            font-family: 'Mukta', sans-serif;
            font-size: 28px;
            line-height: 1.3;
            margin-bottom: 12px;
        }
        .meta { font-size: 13px; color: var(--text-muted); }

        /* Right Sidebar Stack */
        .side-stack { display: flex; flex-direction: column; gap: 16px; }
        .side-card {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 14px;
            padding: 14px;
            align-items: center;
        }
        .side-card img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }
        .side-title {
            font-family: 'Mukta', sans-serif;
            font-size: 17px;
            line-height: 1.35;
            font-weight: 700;
        }

        /* Single Post Focused Reading View (740px Astra Layout) */
        #article-view {
            display: none;
            max-width: 740px;
            margin: 0 auto;
            background: var(--card);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent);
            font-weight: 700;
            cursor: pointer;
        }
        .single-title {
            font-family: 'Mukta', sans-serif;
            font-size: 34px;
            line-height: 1.25;
            margin: 10px 0 16px;
        }
        .single-figure img {
            width: 100%;
            max-height: 440px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 16px;
        }
        .image-credit {
            font-size: 12px;
            color: var(--text-muted);
            text-align: right;
            margin-top: 6px;
            font-style: italic;
        }
        .article-content {
            margin-top: 24px;
            font-size: 18px;
            line-height: 1.85;
        }
        .article-content p { margin-bottom: 18px; }
        .article-content h3 {
            font-family: 'Mukta', sans-serif;
            font-size: 23px;
            margin: 28px 0 10px;
        }
        .source-box {
            margin-top: 30px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>

    <script>
        const articles = [{"title": "मध्य दिल्ली में कार्रवाई: ऐतिहासिक मस्जिद के पास सैकड़ों घरों पर चला प्रशासन का बुलडोजर, बेघर हुए परिवारों का छलका दर्द", "category": "देश-विदेश", "slug": "delhi-historic-mosque-demolition-drive-displaces-residents", "content_html": "<p><strong>नई दिल्ली:</strong> मध्य दिल्ली के एक ऐतिहासिक इलाके में वर्षों से रह रहे सैकड़ों परिवारों पर अचानक दुखों का पहाड़ टूट पड़ा है। प्रशासनिक अधिकारियों ने सरकारी जमीन पर अवैध निर्माण और अतिक्रमण का हवाला देते हुए एक विशाल तोड़फोड़ अभियान चलाया, जिसमें सैकड़ों मकानों को जमींदोज कर दिया गया। ऐतिहासिक मस्जिद के आसपास बसे इस इलाके में हुई इस कड़ी कार्रवाई के बाद सैकड़ों लोग बेघर हो गए हैं और खुले आसमान के नीचे रहने को मजबूर हैं।</p><h3>पीढ़ियों से रह रहे लोगों का छलका दर्द</h3><p>बेघर हुए स्थानीय निवासियों का कहना है कि वे कई पीढ़ियों से इस ऐतिहासिक मस्जिद के आसपास पलते-बढ़ते आए हैं। उनके पूर्वजों ने यहां अपना जीवन बिताया और उनकी बचपन की यादें इस मिट्टी से जुड़ी हुई हैं। एकाएक हुई इस प्रशासनिक कार्रवाई ने न केवल उनके सिर से छत छीन ली है, बल्कि उनकी सालों पुरानी सामाजिक पहचान को भी छिन्न-भिन्न कर दिया है। प्रभावित लोगों का आरोप है कि उन्हें अपना सामान समेटने और संभलने का पर्याप्त समय भी नहीं दिया गया।</p><h3>सरकारी जमीन पर अवैध कब्जे का दावा</h3><p>दूसरी ओर, संबंधित प्रशासनिक प्राधिकरणों का कहना है कि यह कार्रवाई पूरी तरह से नियमानुसार और कानून के दायरे में रहकर की गई है। अधिकारियों के मुताबिक, जिस जमीन पर मकान बने थे, वह सरकारी संपत्ति थी और उस पर लंबे समय से अवैध निर्माण बढ़ता जा रहा था। कई बार नोटिस जारी करने के बावजूद जब कब्जा नहीं हटाया गया, तो अंततः भारी पुलिस बल की मौजूदगी में बुलडोजर कार्रवाई करनी पड़ी। प्रशासन का तर्क है कि सरकारी जमीनों को अतिक्रमण मुक्त कराना बेहद जरूरी है।</p><h3>पुनर्वास और भविष्य पर मंडराया संकट</h3><p>इस बड़ी कार्रवाई के बाद प्रभावित परिवारों के सामने रोजी-रोटी, बच्चों की शिक्षा और छत का गंभीर संकट खड़ा हो गया है। सामाजिक कार्यकर्ताओं और नागरिक समूहों ने बेघर हुए लोगों के लिए तत्काल पुनर्वास नीति लागू करने की मांग की है। प्रभावित निवासियों का कहना है कि जब वे दशकों से यहां रह रहे थे और तमाम सरकारी दस्तावेजों के साथ बुनियादी सुविधाओं का इस्तेमाल कर रहे थे, तब प्रशासन क्यों खामोश रहा? फिलहाल, बेघर हुए परिवार विस्थापन के इस दर्द के बीच राहत और नए आशियाने की गुहार लगा रहे हैं।</p>", "image_url": "https://ichef.bbci.co.uk/ace/standard/976/cpsprodpb/70ed/live/39e7bed0-d676-11f1-a806-e976ee8757a1.jpg", "image_courtesy": "फोटो साभार: BBC News (RSS फ़ीड के माध्यम से)", "original_link": "https://www.bbc.co.uk/news/articles/cwp9gljmp3kdo?at_medium=RSS&at_campaign=rss", "source_name": "BBC News", "date": "08 Nov 2026, 01:21 PM"}, {"title": "दिवाली से पहले दिल्ली की हवा हुई जहरीली, AQI 377 पहुंचा; आतिशबाजी पर पाबंदी लागू", "category": "पर्यावरण", "slug": "delhi-air-quality-worsens-diwali-aqi-very-poor", "content_html": "<p>त्यौहारों के सीजन के बीच देश की राजधानी दिल्ली की हवा लगातार जहरीली होती जा रही है। दिवाली से ठीक पहले दिल्ली और आसपास के इलाकों (NCR) में वायु प्रदूषण का स्तर बेहद चिंताजनक मोड़ पर पहुंच गया है। बुधवार सुबह दिल्ली का औसत वायु गुणवत्ता सूचकांक (AQI) 377 दर्ज किया गया, जो 'बहुत खराब' (Very Poor) श्रेणी में आता है। शहर के कई इलाकों में AQI 400 के करीब दर्ज किया गया, जो 'गंभीर' श्रेणी की दहलीज पर है।</p><h3>पटाखों पर सख्त पाबंदी लागू</h3><p>प्रदूषण के लगातार बिगड़ते हालात को देखते हुए प्रशासन ने दिल्ली में पटाखों के निर्माण, भंडारण, बिक्री और इस्तेमाल पर पूर्ण प्रतिबंध लागू कर दिया है। पर्यावरण विभाग और स्थानीय पुलिस की विशेष टीमें शहर भर में गश्त कर रही हैं ताकि नियमों का कड़ाई से पालन कराया जा सके। हालांकि, पड़ोसी राज्यों में जलाई जा रही पराली, वाहनों से निकलने वाले धुएं और हवा की धीमी गति के कारण स्थिति में सुधार होता नजर नहीं आ रहा है।</p><h3>स्वास्थ्य विशेषज्ञों ने जारी की एडवायजरी</h3><p>हवा में घुले जहरीले कणों (PM 2.5 और PM 10) के कारण दिल्लीवासियों को सांस लेने में भारी तकलीफ का सामना करना पड़ रहा है। स्वास्थ्य विशेषज्ञों ने बुजुर्गों, बच्चों और अस्थमा या दिल के मरीजों को फिलहाल सुबह के वक्त बाहर न निकलने की सलाह दी है। डॉक्टरों का कहना है कि बाहर निकलते समय N95 मास्क का इस्तेमाल बेहद जरूरी है, क्योंकि यह जहरीली हवा फेफड़ों को गंभीर नुकसान पहुंचा सकती है।</p><p>यदि आने वाले दिनों में हवा की रफ्तार नहीं बढ़ी, तो दिवाली के दौरान और उसके बाद दिल्ली-एनसीआर में स्मॉग की स्थिति और भी विकराल हो सकती है। प्रशासन ने ग्रेडेड रिस्पांस एक्शन प्लान (GRAP) के तहत निर्माण कार्यों पर रोक और पानी के छिड़काव जैसे कड़े कदम उठाने शुरू कर दिए हैं।</p>", "image_url": "https://live.staticflickr.com/4909/45424627185_59792f2bc8_b.jpg", "image_courtesy": "फोटो साभार: oatsy40 / Flickr (प्रतीकात्मक तस्वीर)", "original_link": "https://www.bbc.co.uk/news/articles/c699z8792n7ro?at_medium=RSS&at_campaign=rss", "source_name": "BBC News", "date": "08 Nov 2026, 01:16 PM"}, {"title": "भारत की सबसे महंगी फिल्म 'रामायण: राइज़ ऑफ ए लेजेंड' पर आलोचकों की बंटी राय, क्या रच पाएगी इतिहास?", "category": "मनोरंजन", "slug": "ramayana-rise-of-a-legend-indias-costliest-film-divides-critics", "content_html": "<p>भारतीय सिनेमा के इतिहास की सबसे महंगी और महत्वाकांक्षी फिल्म 'रामायण: राइज़ ऑफ ए लेजेंड' आखिरकार सिनेमाघरों में दस्तक दे चुकी है। दो भागों में बनने वाली इस भव्य सिनेमैटिक फ्रेंचाइजी का पहला हिस्सा रिलीज़ होते ही देश-विदेश में चर्चा का केंद्र बन गया है। जहां एक तरफ इस फिल्म को लेकर आम दर्शकों में जबरदस्त क्रेज देखा जा रहा है, वहीं दूसरी तरफ फिल्म समीक्षकों के बीच इसे लेकर बंटी हुई राय देखने को मिल रही है।</p><h3>अभूतपूर्व बजट और भव्य विजुअल इफेक्ट्स</h3><p>पौराणिक महाकाव्य रामायण पर आधारित इस फिल्म को अभूतपूर्व पैमाने पर तैयार किया गया है। बेहतरीन विजुअल इफेक्ट्स (VFX), भव्य सेट्स और अंतरराष्ट्रीय स्तर के एक्शन सीक्वेंस के जरिए प्राचीन भारत के उस गौरवशाली काल को बड़े पर्दे पर जीवंत करने की कोशिश की गई है। निर्माताओं ने इस प्रोजेक्ट में पानी की तरह पैसा बहाया है, जिससे यह भारत की अब तक की सबसे खर्चीली फिल्म बन गई है।</p><h3>आलोचकों में बंटी राय: तकनीक बनाम भावनाएं</h3><p>फिल्म रिलीज़ के साथ ही सिनेमा जगत के जानकारों और आलोचकों की प्रतिक्रियाएं सामने आने लगी हैं। समीक्षकों का एक वर्ग फिल्म के भव्य कैनवास, सिनेमैटोग्राफी और मुख्य कलाकारों के अभिनय की जमकर तारीफ कर रहा है। उनका मानना है कि यह भारतीय सिनेमा को वैश्विक स्तर पर ले जाने वाला प्रयास है।</p><p>वहीं, आलोचकों का दूसरा वर्ग फिल्म की पटकथा और गति से थोड़ा निराश नजर आ रहा है। कुछ समीक्षकों का कहना है कि अत्यधिक स्पेशल इफेक्ट्स और CGI के इस्तेमाल के कारण कथा की आत्मा और भावनात्मक गहराई कहीं पीछे छूट गई है। इसके अलावा, परंपरावादी दर्शकों को पौराणिक संदर्भों के साथ किए गए कुछ आधुनिक प्रयोग भी खास पसंद नहीं आ रहे हैं।</p><h3>बॉक्स ऑफिस पर बंपर कमाई की उम्मीद</h3><p>समीक्षकों की मिली-जुली प्रतिक्रियाओं के बावजूद, सिनेमाघरों में दर्शकों की भारी भीड़ उमड़ रही है। एडवांस बुकिंग के आंकड़े साफ बताते हैं कि दर्शक इस ऐतिहासिक अनुभव को बड़े पर्दे पर देखने के लिए बेहद उत्सुक हैं। दो भागों की इस कहानी का पहला हिस्सा दर्शकों को एक बड़े सस्पेंस मोड़ पर छोड़ता है। अब यह देखना दिलचस्प होगा कि आलोचकों की राय को दरकिनार करते हुए यह फिल्म बॉक्स ऑफिस पर सफलता के कौन से नए आयाम गढ़ती है।</p>", "image_url": "https://ichef.bbci.co.uk/ace/standard/976/cpsprodpb/891f/live/5dbe2290-d932-11f1-93e1-3b657b665bcf.jpg", "image_courtesy": "फोटो साभार: BBC News (RSS फ़ीड के माध्यम से)", "original_link": "https://www.bbc.co.uk/news/articles/cm93zv62v1n7o?at_medium=RSS&at_campaign=rss", "source_name": "BBC News", "date": "08 Nov 2026, 01:11 PM"}, {"title": "दिल्ली में फिर लौटने लगा 'ज़हरीला' धुआं: विंटर एक्शन प्लान तैयार, लेकिन क्या प्रदूषण से मिल पाएगी राहत?", "category": "पर्यावरण", "slug": "delhi-winter-toxic-air-pollution-action-plan-experts-warning", "content_html": "<h3>सर्दियों की दस्तक के साथ गहराने लगा प्रदूषण का संकट</h3><p>देश की राजधानी दिल्ली में एक बार फिर गुलाबी ठंड के आगमन के साथ ही 'ज़हरीली हवा' का दमघोंटू साया मंडराने लगा है। दिल्ली सरकार ने प्रदूषण से निपटने के लिए अपनी तैयारियों का दावा करते हुए चार महीने के विंटर एक्शन प्लान की घोषणा की है। इसमें धूल नियंत्रण, हॉटस्पॉट की निगरानी, पराली के धुएं पर रोक और वाहनों से होने वाले उत्सर्जन को कम करने जैसे कई उपाय शामिल किए गए हैं। हालांकि, पर्यावरण विशेषज्ञों और नीतिगत विश्लेषकों का स्पष्ट मानना है कि सिर्फ चार महीने की यह मौसमी योजना दिल्ली-एनसीआर के निवासियों को स्वच्छ हवा देने के लिए पर्याप्त साबित नहीं होगी।</p><h3>स्थायी समाधान के बजाय आपातकालीन उपायों पर निर्भरता</h3><p>पर्यावरणविदों के अनुसार, दिल्ली की जहरीली हवा केवल सर्दियों का संकट नहीं है, बल्कि यह पूरे वर्ष बने रहने वाले ढांचागत प्रदूषण का परिणाम है जो सर्दियों में प्रतिकूल मौसम के कारण विकराल रूप ले लेता है। विशेषज्ञों का कहना है कि जब तक पड़ोसी राज्यों के साथ तालमेल बिठाकर पूरे इंडो-गांगेय मैदानी क्षेत्र (Indo-Gangetic Plain) के लिए एक एकीकृत रणनीति नहीं बनाई जाती, तब तक समस्या का समाधान असंभव है। केवल निर्माण कार्यों पर रोक लगाने या कुछ दिनों के लिए ऑड-इवन लागू करने जैसे तात्कालिक कदम सिर्फ 'बैंड-एड' उपचार की तरह हैं।</p><h3>स्वास्थ्य पर गंभीर प्रभाव और नागरिकों की चिंताएं</h3><p>हर साल विंटर सीजन के दौरान दिल्ली-एनसीआर की वायु गुणवत्ता सूचकांक (AQI) 'गंभीर' और 'अति गंभीर' श्रेणी में पहुंच जाता है। इसके कारण बच्चों, बुजुर्गों और अस्थमा तथा हृदय रोग से पीड़ित मरीजों के लिए जीवन कठिन हो जाता है। अस्पतालों में सांस के मरीजों की संख्या में भारी उछाल दर्ज किया जाता है। स्थानीय नागरिक और स्वास्थ्य विशेषज्ञ लगातार मांग कर रहे हैं कि सरकारें राजनीति से ऊपर उठकर सार्वजनिक परिवहन के सुदृढ़ीकरण, ठोस कचरा प्रबंधन और औद्योगिक उत्सर्जन पर कड़े नियम लागू करने जैसे दीर्घकालिक और ठोस कदम उठाएं।</p>", "image_url": "https://live.staticflickr.com/4909/45424627185_59792f2bc8_b.jpg", "image_courtesy": "फोटो साभार: oatsy40 / Flickr (प्रतीकात्मक तस्वीर)", "original_link": "https://www.bbc.co.uk/news/articles/cm78p0n09q3xo?at_medium=RSS&at_campaign=rss", "source_name": "BBC News", "date": "08 Nov 2026, 11:44 AM"}, {"title": "दीपों के पर्व दिवाली की देशभर में धूम, रोशनी से जगमगाए घर और मंदिर", "category": "देश", "slug": "diwali-celebrations-begin-across-india-lights-sweets", "content_html": "<h3>रोशनी और खुशियों का महापर्व</h3><p>देशभर में रोशनी का सबसे बड़ा त्योहार, 'दीपावली' बड़े ही धूमधाम और पारंपरिक उत्साह के साथ मनाया जा रहा है। कार्तिक मास की अमावस्या पर मनाया जाने वाला यह पर्व बुराई पर अच्छाई और अंधेरे पर उजाले की विजय का प्रतीक है। देश के कोने-कोने में स्थित ऐतिहासिक मंदिरों से लेकर आम लोगों के घरों तक, हर तरफ मिट्टी के दीयों और रंग-बिरंगी आधुनिक रोशनी की अद्भुत जगमगाहट देखने को मिल रही है।</p><h3>बाजारों में रौनक, दीयों से सजे घर</h3><p>त्योहार को लेकर पिछले कई दिनों से चल रही तैयारियां अब अपने चरम पर पहुंच गई हैं। देश के छोटे-बड़े बाजारों में लोगों की भारी भीड़ उमड़ रही है। नए वस्त्रों, सजावटी सामान, रंगोली के रंगों और पारंपरिक मिठाइयों की दुकानों पर ग्राहकों का तांता लगा हुआ है। लोग अपने रिश्तेदारों और मित्रों को मिठाइयां व उपहार भेंट कर दिवाली की शुभकामनाएं दे रहे हैं। शाम ढलते ही लाखों दीये जलाकर धन-धान्य की देवी मां लक्ष्मी और विघ्नहर्ता भगवान गणेश का स्वागत किया जा रहा है।</p><h3>धार्मिक स्थलों पर भव्य सजावट</h3><p>अयोध्या, वाराणसी, मथुरा और अमृतसर के स्वर्ण मंदिर सहित देश के सभी प्रमुख धार्मिक स्थलों पर दिवाली की भव्यता देखते ही बन रही है। मंदिरों को ताजे फूलों और जगमगाती लड़ियों से दुल्हन की तरह सजाया गया है। श्रद्धालु तड़के से ही पवित्र नदियों में स्नान कर मंदिरों में दर्शन-पूजन के लिए पहुंच रहे हैं। कई ऐतिहासिक शहरों में भव्य महाआरती और 'दीपोत्सव' का आयोजन किया गया है, जहां लाखों दीये एक साथ प्रज्वलित कर नया रिकॉर्ड बनाया जा रहा है।</p><h3>परंपरा और उत्सव का संगम</h3><p>इस साल दीपावली पर पारंपरिक उत्साह के साथ-साथ आतिशबाजी का भी आनंद लिया जा रहा है। परिवारों में एक साथ मिलकर मिठाइयां बांटने, घरों के आंगन में आकर्षक रंगोली बनाने और बच्चों द्वारा पटाखे छुड़ाने का दौर जारी है। रोशनी के इस पावन पर्व ने पूरे देश को एकता, सद्भाव और उल्लास के अनूठे रंग में रंग दिया है।</p>", "image_url": "https://live.staticflickr.com/6103/6322666160_96de687c57_b.jpg", "image_courtesy": "फोटो साभार: MDGovpics / Flickr (प्रतीकात्मक तस्वीर)", "original_link": "https://www.bbc.co.uk/news/articles/cm70pdwz122ro?at_medium=RSS&at_campaign=rss", "source_name": "BBC News", "date": "08 Nov 2026, 11:44 AM"}, {"title": "18 अवॉर्ड्स जीतने के बाद रिलीज हुई यह भारतीय फिल्म, सिनेमाघरों से रोते हुए बाहर निकल रहे दर्शक", "category": "मनोरंजन", "slug": "indian-film-hits-theatres-after-18-awards-emotional-audience-response", "content_html": "<p>भारतीय सिनेमा के इतिहास में अक्सर देखा गया है कि लीक से हटकर बनी फिल्मों को सिनेमाघरों तक पहुंचाने के लिए निर्माताओं को कड़ा संघर्ष करना पड़ता है। ऐसा ही कुछ एक भारतीय फिल्म के साथ हुआ, जिसे शुरुआत में कोई भी डिस्ट्रीब्यूटर रिलीज करने को तैयार नहीं था। हालांकि, दमदार कहानी के दम पर इस फिल्म ने न केवल अंतरराष्ट्रीय स्तर पर सफलता के झंडे गाड़े, बल्कि 18 प्रतिष्ठित पुरस्कार जीतने के बाद जब यह बड़े पर्दे पर आई, तो इसने दर्शकों का दिल पूरी तरह से जीत लिया।</p><h3>थिएटर्स से रोते हुए बाहर निकल रहे लोग</h3><p>सोशल मीडिया पर इन दिनों सिनेमाघरों के बाहर के ऐसे कई भावुक दृश्य वायरल हो रहे हैं, जिन्हें देखकर हर कोई हैरान है। फिल्म देखकर बाहर निकल रहे दर्शक अपनी भावनाओं पर काबू नहीं रख पा रहे हैं और कई लोगों की आंखों में आंसू साफ देखे जा सकते हैं। दर्शकों का कहना है कि फिल्म का कथानक और पात्रों की संवेदनाएं इतनी गहरी हैं कि यह सीधे दिल को छूती हैं। सोशल मीडिया पर लोग इसे इस दशक की सबसे प्रभावशाली फिल्मों में से एक बता रहे हैं।</p><h3>18 अंतरराष्ट्रीय पुरस्कारों के बाद मिला खरीदार</h3><p>इस फिल्म का निर्माण सफर काफी कठिनाइयों भरा रहा। शुरुआत में जब निर्माताओं ने इसे बड़े डिस्ट्रीब्यूटर्स और थिएटर्स मालिकों के सामने पेश किया, तो सभी ने इसे कमर्शियल न मानते हुए रिलीज करने से इनकार कर दिया था। इसके बाद निर्माताओं ने इसे वैश्विक फिल्म समारोहों में भेजने का फैसला किया। दुनिया भर के फेस्टिवल्स में फिल्म की जमकर तारीफ हुई और इसने एक-एक करके 18 अंतरराष्ट्रीय पुरस्कार अपने नाम किए। इन अवॉर्ड्स की बदौलत फिल्म को पहचान मिली और आखिरकार इसे सिनेमाघरों में भव्य रिलीज नसीब हुई।</p><h3>कंटेंट और स्वतंत्र सिनेमा की बड़ी जीत</h3><p>फिल्म को मिल रहा यह अप्रत्याशित प्यार भारतीय इंडिपेंडेंट (स्वतंत्र) सिनेमा के लिए एक नया सवेरा माना जा रहा है। फिल्म समीक्षकों का मानना है कि इस घटना ने साबित कर दिया है कि अगर फिल्म की कहानी सच्ची और कंटेंट मजबूत हो, तो उसे दर्शकों के दिलों तक पहुंचने से कोई नहीं रोक सकता। यह सफलता उन तमाम युवा फिल्म निर्माताओं के लिए प्रेरणा है जो बिना किसी बड़े स्टारकास्ट के बेहतरीन कहानियां कहने का माद्दा रखते हैं।</p>", "image_url": "https://ichef.bbci.co.uk/ace/standard/976/cpsprodpb/1489/live/c9303e00-d9eb-11f1-bbe5-797ee05bee69.jpg", "image_courtesy": "फोटो साभार: BBC News (RSS फ़ीड के माध्यम से)", "original_link": "https://www.bbc.co.uk/news/articles/c6ly334rem5do?at_medium=RSS&at_campaign=rss", "source_name": "BBC News", "date": "08 Nov 2026, 11:44 AM"}];

        function renderHome() {
            const container = document.getElementById('bento-container');
            if (!articles.length) return;

            const hero = articles[0];
            let sideHtml = '';
            articles.slice(1, 5).forEach((art, idx) => {
                sideHtml += `
                <div class="card side-card" onclick="openArticle(${idx + 1})">
                    <img src="${art.image_url}" alt="">
                    <div>
                        <span class="badge">${art.category || 'प्रमुख समाचार'}</span>
                        <div class="side-title">${art.title}</div>
                        <div class="meta">${art.date}</div>
                    </div>
                </div>`;
            });

            container.innerHTML = `
                <div class="card" onclick="openArticle(0)">
                    <div class="img-wrap"><img src="${hero.image_url}" alt=""></div>
                    <div class="card-body">
                        <span class="badge">${hero.category || 'बड़ी खबर'}</span>
                        <h2 class="hero-title">${hero.title}</h2>
                        <div class="meta">प्रकाशित: ${hero.date} • 2 मिनट पठन</div>
                    </div>
                </div>
                <div class="side-stack">${sideHtml}</div>
            `;
        }

        function openArticle(index) {
            const art = articles[index];
            document.getElementById('art-badge').innerText = art.category || 'ताज़ा खबर';
            document.getElementById('art-title').innerText = art.title;
            document.getElementById('art-meta').innerText = `प्रकाशित: ${art.date} | SEO Slug: /${art.slug}`;
            document.getElementById('art-img').src = art.image_url;
            document.getElementById('art-credit').innerText = art.image_courtesy;
            document.getElementById('art-body').innerHTML = art.content_html;
            document.getElementById('art-source').innerHTML = `<em>स्रोत और साभार: यह रिपोर्ट <a href="${art.original_link}" target="_blank" rel="nofollow">${art.source_name}</a> की मूल खबर के तथ्यों पर आधारित है।</em>`;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('article-view').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function showHome() {
            document.getElementById('article-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo(0, 0);
        }

        renderHome();
    </script>
